  de: "Die Sitzungsliste jedes Kontos wird auf diesen Zeitpunkt zurückgesetzt. Die aktuellen Listen werden vorher als Schnappschuss gesichert."
  es: "La lista de sesiones de cada cuenta vuelve a ese momento. Antes se guardan las listas actuales en una instantánea."
  pt-BR: "A lista de sessões de cada conta volta àquele momento. As listas atuais são guardadas antes em um instantâneo."
