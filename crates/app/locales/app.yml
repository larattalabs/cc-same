"settings.kept.long":
  en: "Sessions stay reopenable for as long as you are likely to need them."
  zh-CN: "在你可能需要的时间里，会话都能重新打开。"
  zh-TW: "在你可能需要的時間裡，工作階段都能重新開啟。"
  ja: "必要になりそうな期間は、セッションを開き直せます。"
  ko: "필요한 기간 동안 세션을 다시 열 수 있습니다."
  fr: "Les sessions restent rouvrables aussi longtemps que vous en aurez sans doute besoin."
  de: "Sitzungen lassen sich so lange öffnen, wie du sie voraussichtlich brauchst."
  es: "Las sesiones se pueden reabrir durante todo el tiempo que probablemente las necesites."
  pt-BR: "As sessões continuam reabríveis pelo tempo que você provavelmente vai precisar."
  ru: "Сессии можно будет открыть столько, сколько они, скорее всего, понадобятся."
"settings.kept.short":
  en: "Claude Code deletes older transcripts, and a session can’t reopen without one."
  zh-CN: "Claude Code 会删除较早的对话记录，没有记录的会话就打不开了。"
  zh-TW: "Claude Code 會刪除較早的對話記錄，沒有記錄的工作階段就打不開了。"
  ja: "Claude Code は古い会話記録を削除します。記録がないセッションは開けません。"
  ko: "Claude Code는 오래된 대화 기록을 삭제하며, 기록이 없는 세션은 다시 열 수 없습니다."
  fr: "Claude Code supprime les anciennes transcriptions, et une session ne peut pas se rouvrir sans elle."
  de: "Claude Code löscht ältere Transkripte, und ohne Transkript lässt sich eine Sitzung nicht öffnen."
  es: "Claude Code borra las transcripciones antiguas, y una sesión no se puede reabrir sin la suya."
  pt-BR: "O Claude Code apaga transcrições antigas, e uma sessão não reabre sem a sua."
  ru: "Claude Code удаляет старые записи бесед, а без записи сессию не открыть."
