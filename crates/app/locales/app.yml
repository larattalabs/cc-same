"headline.linked.detail.one":
  en: "Another tool linked %{count} session folder, and Claude stops saving sessions there."
  fr: "Un autre outil a lié %{count} dossier de sessions, et Claude n’y enregistre plus rien."
  de: "Ein anderes Tool hat %{count} Sitzungsordner verknüpft, und Claude speichert dort keine Sitzungen mehr."
  es: "Otra herramienta enlazó %{count} carpeta de sesiones y Claude ya no guarda sesiones allí."
  pt-BR: "Outra ferramenta vinculou %{count} pasta de sessões, e o Claude parou de salvar sessões nela."
  ru: "Другая программа превратила %{count} папку сессий в ссылку, и Claude больше не сохраняет туда сессии."
