"headline.missing.detail":
  en: "Install Claude and sign in. This window updates by itself."
  zh-CN: "安装 Claude 并登录，这个窗口会自动更新。"
  zh-TW: "安裝 Claude 並登入，這個視窗會自動更新。"
  ja: "Claude をインストールしてサインインしてください。このウインドウは自動で更新されます。"
  ko: "Claude를 설치하고 로그인하세요. 이 창은 자동으로 업데이트됩니다."
  fr: "Installez Claude et connectez-vous. Cette fenêtre se met à jour toute seule."
  de: "Installiere Claude und melde dich an. Dieses Fenster aktualisiert sich selbst."
  es: "Instala Claude e inicia sesión. Esta ventana se actualiza sola."
  pt-BR: "Instale o Claude e entre na sua conta. Esta janela se atualiza sozinha."
  ru: "Установите Claude и войдите в аккаунт. Это окно обновится само."
"headline.single.title":
  en: "One account so far"
