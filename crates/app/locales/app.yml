  zh-TW: "另一個工具把 %{count} 個工作階段資料夾改成了連結，Claude 因此不再在那裡儲存工作階段。"
  ja: "別のツールが %{count} 個のセッションフォルダをリンクに変えたため、Claude はそこにセッションを保存できなくなっています。"
  ko: "다른 도구가 세션 폴더 %{count}개를 링크로 바꿔서 Claude가 그곳에 세션을 저장하지 못합니다."
  fr: "Un autre outil a lié %{count} dossiers de sessions, et Claude n’y enregistre plus rien."
  de: "Ein anderes Tool hat %{count} Sitzungsordner verknüpft, und Claude speichert dort keine Sitzungen mehr."
  es: "Otra herramienta enlazó %{count} carpetas de sesiones y Claude ya no guarda sesiones allí."
  pt-BR: "Outra ferramenta vinculou %{count} pastas de sessões, e o Claude parou de salvar sessões nelas."
